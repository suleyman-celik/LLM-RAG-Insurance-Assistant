services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network  # Ensure network is correctly referenced

  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
  #   container_name: elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #   ports:
  #     - "9200:9200"
  #     - "9300:9300"
  #   networks:
  #     - app-network  # Ensure network is correctly referenced

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
      - ./entrypoint_ollama.sh:/root/entrypoint.sh # Mount the entrypoint script 
    ports:
      - "11434:11434"
    networks:
      - app-network  # Ensure network is correctly referenced
    entrypoint: ["/usr/bin/bash", "/root/entrypoint.sh"]


  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres  # Ensure POSTGRES_HOST points to the service name
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      HF_TOKEN: ${HF_TOKEN} # Hugging Face token
      # METABASE_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY}
      # DATA_PATH: "Data/document-with-ids.json"
    ports:
      - "${APP_PORT}:9000"
    depends_on:
      - postgres
    networks:
      - app-network  # Ensure network is correctly referenced


  # metabase:
  #   image: metabase/metabase:latest
  #   container_name: customer_assistant_metabase
  #   ports:
  #     - "${METABASE_PORT}:3000"
  #   environment:
  #     MB_DB_TYPE: postgres
  #     MB_DB_DBNAME: ${POSTGRES_DB}
  #     MB_DB_PORT: ${POSTGRES_PORT}
  #     MB_DB_USER: ${POSTGRES_USER}
  #     MB_DB_PASS: ${POSTGRES_PASSWORD}
  #     MB_DB_HOST: ${POSTGRES_HOST}
  #     MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY}
  #     MB_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL}
  #     MB_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD}
  #   depends_on:
  #     - postgres
  #   networks:
  #     - app-network  # Ensure network is correctly referenced
      
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    depends_on:
      - postgres
    networks:
      - app-network  # Ensure network is correctly referenced

  adminer:
    restart: unless-stopped
    image: "adminer:latest"
    container_name: "adminer"
    env_file:
      - .env
    environment:
      ADMINER_PORT: "${ADMINER_PORT:-9002}"
    ports:
      ## External Access: Used to specify port mappings between the Docker host and the container.
      ## "<host_port>:<container_port>"
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - "app-network"
    depends_on:
      - postgres

volumes:
  postgres_data:
  grafana_data:
  ollama:

networks:
  app-network:  # Define the network globally
    driver: bridge